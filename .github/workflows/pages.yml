name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Integration suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the service worker manifest is current
        run: |
          node tools/make-sw.mjs
          git diff --exit-code sw.js || {
            echo "::error file=sw.js::sw.js is stale — run 'npm run sw' and commit the result";
            exit 1;
          }
      - run: npm test

  deploy:
    name: Publish
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # One-time setup: repository Settings -> Pages -> Build and deployment ->
    # Source: "GitHub Actions". The workflow token is not allowed to switch that
    # on itself. Everything here is path-relative, so no base-URL configuration
    # is needed and the site works from a repository subpath.
    steps:
      - uses: actions/checkout@v4
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
